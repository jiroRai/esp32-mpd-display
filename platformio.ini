; PlatformIO Project Configuration File
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = dio
board_build.partitions = no_ota.csv

extra_scripts = patches/apply_patches.py

lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	lvgl/lvgl@^8.3.11

build_flags = 
	; --- LVGL 核心配置 ---
	-D LV_CONF_SKIP=1
	-D LV_COLOR_DEPTH=16
	-D LV_TICK_CUSTOM=1
	; --- LVGL 性能与 FPS 优化 ---
	-D LV_DISP_DEF_REFR_PERIOD=16
	-D LV_INDEV_DEF_READ_PERIOD=16
	; --- LVGL FPS 监视器 ---	
	; -D LV_USE_PERF_MONITOR=1
	; --- 禁用 LVGL 不需要的功能以减小内存占用 ---
	-D LV_USE_ANIMATION=1
	-D LV_USE_OBJ_REALIGN=0
	-D LV_USE_GROUP=0
	-D LV_USE_MSG=0
	-D LV_USE_REFR_DEBUG=0
	-D LV_MEM_SIZE=32768
	-D LV_DPI_DEF=130
